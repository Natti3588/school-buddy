{% extends "student/base.html" %}
{% block title %}出席する - {{ system_name }}{% endblock %}

{% block content %}
<div class="test-card text-center">

    <a href="{% url 'student_top' %}" class="small link-board d-block text-start">‹ ホームへ</a>
    <h1 class="h3 fw-bold mt-2 mb-1">出席する</h1>
    <p class="text-muted mb-3">{{ student.classroom }} {{ student.attendance_number }}番　{{ student.name }} さん</p>

    <p class="mb-3">黒板やテレビに映っている<span class="fw-bold">QRコード</span>を、カメラで読み取ってください。</p>

    <!-- カメラを使えないとき（読み取った結果は、結果画面に出す） -->
    <div class="alert alert-danger text-start" id="scanError" role="alert" hidden></div>

    <!-- カメラの映像（html5-qrcode がこの中に表示する） -->
    <div id="reader" class="scan-reader mx-auto"></div>
    <p class="small text-muted mt-2 mb-0" id="scanStatus">カメラを準備しています…</p>

    <!-- 読み取ったトークンを送るフォーム（CSRF つきの POST） -->
    <form method="post" id="scanForm">
        {% csrf_token %}
        <input type="hidden" name="token" id="token">
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(function () {
    const SCAN_PATH = "{% url 'attendance:scan' %}";
    const status = document.getElementById("scanStatus");
    const errorBox = document.getElementById("scanError");

    function showError(text) {
        errorBox.textContent = text;
        errorBox.hidden = false;
    }

    if (typeof Html5Qrcode === "undefined") {
        status.textContent = "読み取りの準備ができません（インターネットに接続してください）";
        return;
    }

    // QR コードの中身は「…/attendance/scan/?t=トークン」。トークンを取り出す
    // 出欠管理の QR コードでなければ空にする（サーバーが「無効なQRコード」の結果画面を出す）
    function tokenOf(text) {
        try {
            const url = new URL(text);
            if (url.pathname !== SCAN_PATH) return "";
            return url.searchParams.get("t") || "";
        } catch (e) {
            return "";   // URL でない QR コード
        }
    }

    const scanner = new Html5Qrcode("reader");
    let sending = false;

    function onScan(text) {
        if (sending) return;
        sending = true;
        status.textContent = "送信しています…";
        document.getElementById("token").value = tokenOf(text);
        // カメラを止めてから送る（止められなくても送る）
        scanner.stop().catch(() => {}).finally(() => document.getElementById("scanForm").submit());
    }

    // 背面カメラを使う（タブレットを QR コードに向けるため）
    scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 240, height: 240 } }, onScan, () => {})
        .then(() => status.textContent = "QRコードを枠の中に入れてください")
        .catch(() => {
            status.textContent = "";
            showError("カメラを使えません。カメラの使用を許可してから、画面を再読み込みしてください");
        });
})();
</script>
{% endblock %}
