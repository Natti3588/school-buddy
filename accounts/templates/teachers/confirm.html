{% extends "base.html" %}
{% block title %}教員の確認 - {{ system_name }}{% endblock %}

{% block content %}

<a href="{% url 'teachers:list' %}" class="small link-board">‹ 教員アカウント管理</a>
<h1 class="h3 fw-bold mt-1 mb-3">教員を追加</h1>
{% include "students/_steps.html" with step=2 %}

<div class="note-card form-card p-4">
    <h2 class="h5 fw-bold mb-1">この内容で登録しますか？</h2>
    <p class="text-muted small mb-3">間違いがある場合は「修正する」を押してください。</p>

    <table class="table confirm-table mb-4">
        <tbody>
            <tr><th>氏名</th><td>{{ t.name }}</td></tr>
            <tr><th>ふりがな</th><td>{{ t.furigana }}</td></tr>
        </tbody>
    </table>

    <form method="post" action="{% url 'teachers:confirm' %}" class="d-flex flex-wrap justify-content-between gap-2">
        {% csrf_token %}
        <!-- 入力済みの値を残したまま入力画面に戻る -->
        <a href="{% url 'teachers:new' %}?edit=1" class="btn btn-outline-board px-4">‹ 修正する</a>
        <button type="submit" class="btn btn-board px-4">登録する</button>
    </form>
</div>

{% endblock %}
