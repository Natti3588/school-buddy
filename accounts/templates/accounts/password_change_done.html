{% extends "student/base.html" %}
{% block title %}パスワード変更完了 - {{ system_name }}{% endblock %}
{% block heading %}パスワードの変更{% endblock %}

{% block content %}
<div class="test-card note-card p-4 p-md-5 text-center" style="max-width: 560px;">
    <div class="display-4 mb-2" style="color: var(--board);" aria-hidden="true">✓</div>
    <h1 class="h3 fw-bold mb-2">パスワードを変更しました</h1>
    <p class="text-muted mb-4">
        次からは、新しいパスワードでログインしてください。<br>
        パスワードはほかの人に教えないでください。
    </p>
    <div class="d-grid">
        <a href="{% url 'student_top' %}" class="btn btn-board btn-lg">トップ画面へ</a>
    </div>
</div>
{% endblock %}
