<!DOCTYPE html>
<html lang="ja">
<head>
    {% include "_head.html" %}
    <title>{% block title %}{{ system_name }}{% endblock %}</title>
</head>
<body>

<!-- ヘッダー -->
<header class="app-header">
    <div class="container-fluid d-flex align-items-center justify-content-between py-2 px-3">

        <div class="d-flex align-items-center gap-2">
            <!-- スマホ用メニューボタン -->
            <button class="btn btn-sm btn-outline-light d-md-none" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#sideMenu" aria-label="メニュー">☰</button>

            <a class="brand chalk-font" href="{% url 'top' %}">{{ system_name }}</a>
        </div>

        <div class="d-flex align-items-center gap-3">
            <span class="d-none d-sm-inline">{{ user.name }} 先生（{{ user.school }}）</span>
            <!-- TODO: ログアウト画面を作ったら差し替える -->
            <a href="#" class="btn btn-outline-light btn-sm">ログアウト</a>
        </div>

    </div>
</header>

<div class="container-fluid">
    <div class="row">

        <!-- サイドバー（PC：常に表示／スマホ：☰で開く） -->
        <nav class="col-md-3 col-lg-2 p-0 sidebar offcanvas-md offcanvas-start" tabindex="-1" id="sideMenu">
            <div class="offcanvas-header d-md-none">
                <span class="fw-bold">メニュー</span>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sideMenu"></button>
            </div>
            <div class="pt-2">
                {% with ep=request.resolver_match.url_name %}
                <a href="{% url 'top' %}" class="side-link {% if ep == 'top' %}active{% endif %}">
                    <span class="dot c-home"></span>ホーム
                </a>
                <!-- TODO: 各機能の画面を作ったら href と active の条件を差し替える -->
                <a href="#" class="side-link">
                    <span class="dot c-time"></span>時間割・授業時数
                </a>
                <a href="#" class="side-link">
                    <span class="dot c-sub"></span>補欠の割り当て
                </a>
                <a href="#" class="side-link">
                    <span class="dot c-submit"></span>提出物チェック
                </a>
                <a href="#" class="side-link">
                    <span class="dot c-quiz"></span>小テスト
                </a>
                <a href="#" class="side-link">
                    <span class="dot c-attend"></span>出欠管理
                </a>
                {% endwith %}
            </div>
        </nav>

        <!-- メイン -->
        <main class="col-md-9 col-lg-10 content">
            {% block content %}{% endblock %}
        </main>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
